<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamFetch</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        slate: {
                            850: '#1e293b',
                            900: '#0f172a',
                            950: '#020617',
                        },
                        cyan: {
                            400: '#22d3ee',
                            500: '#06b6d4',
                            600: '#0891b2',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen flex flex-col">

    <!-- Header -->
    <header class="glass sticky top-0 z-50">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 bg-gradient-to-br from-cyan-400 to-blue-600 rounded-lg flex items-center justify-center shadow-lg shadow-cyan-500/20">
                    <i class="fas fa-wave-square text-white text-lg"></i>
                </div>
                <h1 class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-cyan-400 to-blue-500">
                    StreamFetch
                </h1>
            </div>
            <div id="connectionStatus" class="hidden text-xs px-3 py-1 rounded-full bg-red-500/20 text-red-400 border border-red-500/30">
                Disconnected
            </div>
            <!-- Mobile Queue Toggle (Visible only on small screens) -->
            <button id="mobileQueueBtn" class="lg:hidden p-2 text-slate-400 hover:text-cyan-400 transition-colors">
                <i class="fas fa-list-ul text-xl"></i>
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow container mx-auto px-4 py-8 flex flex-col lg:flex-row gap-8">
        
        <!-- Left Column: Search & Results -->
        <div class="w-full lg:w-2/3 flex flex-col space-y-8">
            
            <!-- Hero Search -->
            <div class="text-center space-y-6 pt-8 pb-4 animate-fade-in">
                <h2 class="text-4xl md:text-5xl font-bold tracking-tight text-white drop-shadow-lg">
                    Discover High-Res Audio
                </h2>
                <p class="text-slate-400 text-lg max-w-2xl mx-auto">
                    Search and download your favorite tracks in Master quality directly from Tidal.
                </p>
                
                <div class="relative max-w-2xl mx-auto group">
                    <div class="absolute -inset-1 bg-gradient-to-r from-cyan-400 to-blue-600 rounded-full blur opacity-25 group-hover:opacity-50 transition duration-1000 group-hover:duration-200"></div>
                    <div class="relative flex items-center bg-slate-800 rounded-full border border-slate-700 shadow-2xl overflow-hidden focus-within:border-cyan-500/50 transition-colors">
                        <input type="text" id="searchInput" 
                            class="w-full bg-transparent text-white px-6 py-4 outline-none placeholder-slate-500 text-lg"
                            placeholder="Search for songs, artists, or albums..." autofocus>
                        <button id="searchBtn" class="px-8 py-4 bg-slate-700 hover:bg-slate-600 text-cyan-400 transition-colors border-l border-slate-700">
                            <i class="fas fa-search text-xl"></i>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Results Grid -->
            <div id="resultsList" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- Results will be injected here -->
                <div class="col-span-full text-center py-12 text-slate-500 animate-fade-in">
                    <i class="fas fa-music text-4xl mb-4 opacity-20"></i>
                    <p>Start searching to see results</p>
                </div>
            </div>
        </div>

        <!-- Right Column: Queue (Hidden on mobile, toggled via drawer or simple stack) -->
        <!-- On LG, it's a sticky side pane -->
        <div class="hidden lg:block w-full lg:w-1/3">
            <div class="sticky top-24 space-y-4">
                <h3 class="text-lg font-semibold text-slate-200 flex items-center gap-2">
                    <i class="fas fa-cloud-download-alt text-cyan-400"></i> Download Queue
                </h3>
                
                <!-- Current Download Card -->
                <div id="currentDownload" class="hidden glass-card rounded-xl p-4 shadow-lg border-l-4 border-cyan-500 animate-slide-up">
                    <div class="flex justify-between items-start mb-2">
                        <div class="overflow-hidden">
                            <h4 id="currentTitle" class="font-medium text-white truncate">Track Title</h4>
                            <p id="statusText" class="text-xs text-cyan-400 mt-1">Downloading...</p>
                        </div>
                        <div id="progressText" class="text-xs font-mono text-slate-400">0%</div>
                    </div>
                    <!-- Progress Bar -->
                    <div class="w-full bg-slate-700 rounded-full h-1.5 overflow-hidden">
                        <div id="progressBar" class="bg-gradient-to-r from-cyan-400 to-blue-500 h-full rounded-full transition-all duration-300" style="width: 0%"></div>
                    </div>
                </div>

                <!-- Queue List -->
                <div id="queueList" class="space-y-2 max-h-[60vh] overflow-y-auto pr-2 custom-scrollbar">
                    <!-- Queue items will be injected here -->
                </div>
            </div>
        </div>
    </main>
    
    <!-- Toast Container -->
    <div id="toastContainer" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <!-- Templates -->
    <template id="resultTemplate">
        <div class="glass-card rounded-xl p-4 flex items-center gap-4 hover:bg-slate-800/80 transition-all duration-300 group animate-fade-in relative overflow-hidden">
            <!-- Hover Overlay -->
            <div class="absolute inset-0 bg-cyan-500/10 opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none"></div>
            
            <!-- Art Placeholder -->
            <div class="w-16 h-16 bg-slate-700 rounded-lg flex-shrink-0 flex items-center justify-center shadow-inner">
                <i class="fas fa-record-vinyl text-slate-500 text-xl group-hover:text-cyan-400 transition-colors"></i>
            </div>
            
            <div class="flex-grow min-w-0">
                <h3 class="result-title font-semibold text-white truncate group-hover:text-cyan-400 transition-colors">Title</h3>
                <p class="result-artist text-sm text-slate-400 truncate">Artist</p>
                <div class="flex items-center gap-2 mt-1">
                    <span class="result-quality text-[10px] uppercase font-bold px-1.5 py-0.5 rounded bg-slate-700 text-slate-300">High</span>
                    <span class="result-album text-xs text-slate-500 truncate max-w-[150px]">Album</span>
                </div>
            </div>
            
            <button class="download-btn w-10 h-10 rounded-full bg-slate-700 hover:bg-cyan-500 text-cyan-400 hover:text-white flex items-center justify-center transition-all shadow-lg transform active:scale-95 z-10">
                <i class="fas fa-download"></i>
            </button>
        </div>
    </template>

    <template id="queueItemTemplate">
        <div class="bg-slate-800/50 rounded-lg p-3 flex justify-between items-center border border-slate-700/50">
            <div class="min-w-0 pr-4">
                <div class="queue-title text-sm font-medium text-slate-200 truncate">Title</div>
                <div class="queue-artist text-xs text-slate-500 truncate">Artist</div>
            </div>
            <i class="fas fa-clock text-slate-600 text-xs"></i>
        </div>
    </template>

    <script src="/static/js/app.js"></script>
</body>
</html>
